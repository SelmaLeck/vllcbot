<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vullco • Twitch Bot</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#eaf3ff;background:#070e20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#153776 0%,transparent 44%),#070e20;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}header{padding:26px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29416e66}h1,h2,p{margin-top:0}.logo{font-size:28px;font-weight:900;letter-spacing:-1px}.logo span{color:#47a1ff}.small{color:#8ca8d0;font-size:13px}.shell{max-width:1200px;margin:30px auto;padding:0 22px}.layout{display:grid;grid-template-columns:230px 1fr;gap:24px}.nav{display:flex;flex-direction:column;gap:9px}.nav button{background:#101d38;border:1px solid #29426e;color:#a6bee1;border-radius:12px;text-align:left;padding:15px}.nav button.active,.nav button:hover{background:linear-gradient(110deg,#1450c2,#0a8de4);color:white}.panel,.card{background:#0e1b34df;border:1px solid #25416a;border-radius:18px;padding:25px;box-shadow:0 18px 50px #0003}.card{padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.metric{font-size:28px;font-weight:800;color:#65b8ff;margin:8px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#abc5ea;font-size:13px;margin-bottom:7px}input,textarea{width:100%;padding:12px 13px;border:1px solid #31517f;background:#0a1429;color:white;border-radius:10px;outline:none}input:focus,textarea:focus{border-color:#429aff}input[type=checkbox]{width:auto;accent-color:#278afa}textarea{resize:vertical;min-height:70px}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700;background:#2879ea;color:white}.btn.secondary{background:#172b4d;border:1px solid #37527a}.btn.danger{background:#6b2444}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #284368;border-radius:12px;padding:15px;margin-bottom:10px}.item strong{color:#89c7ff}.item p{margin:5px 0;color:#b1c5e3;overflow-wrap:anywhere}.pill{font-size:12px;background:#133b65;border-radius:20px;padding:5px 9px;color:#83c8ff}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.hide{display:none!important}#login{max-width:440px;margin:10vh auto}.muted{color:#a6b8d3}.hint{font-size:13px;color:#93aad0}#notice{min-height:20px;color:#8ed4ff;margin:15px 0}a{color:#69b6ff}.header-actions{display:flex;align-items:center;gap:9px}.mini-connect{font-size:12px;padding:8px 11px;white-space:nowrap;text-decoration:none;border:1px solid #31517f;border-radius:9px;color:#b6d8ff;background:#101e39}.mini-connect.online{border-color:#206c78;color:#a2f7e6}.status-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px;margin-bottom:18px;border:1px solid #315484;border-radius:16px;background:linear-gradient(115deg,#122b53,#0a1c39)}.status-kicker{font-size:12px;color:#a4bedf;text-transform:uppercase;letter-spacing:1.4px}.status-title{font-size:24px;font-weight:800;margin:6px 0}.status-detail{color:#abc4e5;font-size:13px}.status-light{width:15px;height:15px;flex:none;border-radius:50%;box-shadow:0 0 0 5px #ffffff0b}.status-online{background:#25d69c;box-shadow:0 0 18px #25d69c88}.status-offline{background:#ffb454;box-shadow:0 0 18px #ffb45477}.status-stopped{background:#8296b5}.control-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.control-actions button:disabled{opacity:.45;cursor:wait}.footer{text-align:center;color:#93aad0;padding:26px 12px;font-size:13px}hr{border:0;border-top:1px solid #284368;margin:20px 0}@media(max-width:740px){.layout{display:block}.nav{flex-direction:row;overflow:auto;margin-bottom:20px}.nav button{white-space:nowrap}.formgrid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><div class="logo">VULL<span>CO</span> <span style="font-size:13px;letter-spacing:2px">BOT</span></div><div class="small">TWITCH CONTROL CENTER</div></div><div class="header-actions"><a class="mini-connect hide" id="spotifyConnect" href="/auth/spotify/start" title="Spotify verbinden">○ Spotify</a><a class="mini-connect hide" id="twitchConnect" href="/auth/twitch/start" title="Twitch verbinden">◌ Twitch</a><button class="btn secondary hide" id="logout">Abmelden</button></div></header>
<main id="login" class="panel"><h2>Dashboard Login 💙</h2><p class="muted">Melde dich mit deinem Panel-Passwort an.</p><form id="loginForm"><label>Passwort</label><input type="password" id="password" autocomplete="current-password" required><p></p><button class="btn">Einloggen</button></form><p id="loginError" class="hint"></p></main>
<main id="dashboard" class="shell hide"><div class="layout"><nav class="nav" id="nav"><button data-tab="overview" class="active">◈ Übersicht</button><button data-tab="commands">⌘ Commands</button><button data-tab="timers">◷ Timer</button><button data-tab="birthdays">♡ Geburtstage</button><button data-tab="settings">⚙ Einstellungen</button></nav><section class="panel"><div id="content"></div><p id="notice"></p></section></div></main><footer class="footer">made by selma ♥</footer>
<script>
let csrf='',state={},runtime={},tab='overview',edit=null;
const $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,method='GET',body)=>{const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-vullco-csrf':csrf},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Serverfehler');return data};
function notice(s){$('#notice').textContent=s;setTimeout(()=>{if($('#notice'))$('#notice').textContent=''},4000)}
async function load(){const data=await api('/api/state');state=data.state;runtime=data.runtime;render()}
async function boot(){const me=await api('/api/me');if(!me.loggedIn)return;csrf=me.csrf;$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');$('#logout').classList.remove('hide');await load();await updateConnections()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/login','POST',{password:$('#password').value});csrf=r.csrf;await boot()}catch(err){$('#loginError').textContent=err.message}};
$('#logout').onclick=async()=>{await api('/api/logout','POST');location.reload()};
async function updateConnections(){try{const r=await api('/api/twitch/status');const a=$('#twitchConnect');a.classList.remove('hide');a.textContent=r.connected?'● Twitch':'○ Twitch';a.title=r.connected?'Twitch verbunden – erneut verbinden':'Twitch verbinden';a.classList.toggle('online',r.connected)}catch{}try{const r=await api('/api/spotify/status');const a=$('#spotifyConnect');a.classList.remove('hide');a.textContent=r.authorized?'● Spotify':'○ Spotify';a.title=r.authorized?'Spotify verbunden – erneut verbinden':'Spotify verbinden';a.classList.toggle('online',r.authorized)}catch{}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;edit=null;$('#nav').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};
function render(){const el=$('#content');if(tab==='overview'){el.innerHTML=`<div class="top"><div><h2>V//BOT</h2><p class="muted"></p></div></div><div class="status-hero" role="status" aria-live="polite"><div><div class="status-kicker">Bot-Status</div><div class="status-title">${runtime.connected&&state.botEnabled?'Online':!state.botEnabled?'Ausgeschaltet':'Offline'}</div><div class="status-detail">${runtime.connected&&state.botEnabled?'Mit Twitch verbunden':!state.botEnabled?'Bot ist pausiert – die Website bleibt erreichbar':'Keine aktive Twitch-Chat-Verbindung'}</div></div><span class="status-light ${runtime.connected&&state.botEnabled?'status-online':!state.botEnabled?'status-stopped':'status-offline'}" aria-hidden="true"></span></div><div class="grid"><div class="card"><div class="small">Aktive Commands</div><div class="metric">${state.commands.filter(x=>x.enabled).length}</div></div><div class="card"><div class="small">Aktive Timer</div><div class="metric">${state.timers.filter(x=>x.enabled).length}</div></div><div class="card"><div class="small">Geburtstage</div><div class="metric">${Object.keys(state.birthdays).length}</div></div></div><div class="card"><h3>Bot-Steuerung</h3><span class="pill">${state.botEnabled?(runtime.connected?'● Online':'○ Verbindet / Offline'):'○ Ausgeschaltet'}</span><div class="control-actions"><button class="btn secondary" id="botRestart">↻ Neustarten</button><button class="btn ${state.botEnabled?'danger':'secondary'}" id="botToggle">${state.botEnabled?'⏻ Ausschalten':'▶ Einschalten'}</button></div></div>`;setupBotButtons();return;}
function setupBotButtons(){
 const restart=$('#botRestart'),toggle=$('#botToggle');
 async function act(action){
  const isStop=action==='stop';
  if(isStop&&!confirm('Twitch-Bot ausschalten? Die Website bleibt erreichbar.'))return;
  if(action==='restart'&&!confirm('Twitch-Verbindung jetzt neu starten?'))return;
  restart.disabled=true;toggle.disabled=true;
  try{await api('/api/bot/'+action,'POST');await load();await updateConnections();notice(action==='stop'?'Bot ausgeschaltet':action==='start'?'Bot eingeschaltet':'Twitch-Bot neu gestartet');}
  catch(err){notice(err.message);await load();}finally{restart.disabled=false;toggle.disabled=false;}
 }
 restart.onclick=()=>act('restart');toggle.onclick=()=>act(state.botEnabled?'stop':'start');
}
if(tab==='commands'||tab==='timers'){const cmd=tab==='commands',items=state[tab],editing=items.find(x=>x.id===edit);el.innerHTML=`<div class="top"><div><h2>${cmd?'Chat Commands':'Automatische Timer'}</h2><p class="muted">${cmd?'Antworten direkt im Twitch-Chat verwalten.':'Nach Zeit und Chat-Aktivität posten.'}</p></div><button class="btn" id="new">+ Neu</button></div><div id="editor"></div><div>${items.map(x=>`<div class="item"><div><strong>${escapeHtml(cmd?x.trigger:x.message)}</strong><p>${cmd?escapeHtml(x.reply):`Alle ${Number(x.minutes)} Min. · mindestens ${Number(x.minMessages)} Nachrichten`} <span class="pill">${x.enabled?'Aktiv':'Inaktiv'}</span></p></div><div class="actions"><button class="btn secondary" data-edit="${escapeHtml(x.id)}">Bearbeiten</button><button class="btn danger" data-delete="${escapeHtml(x.id)}">Löschen</button></div></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}</div>`;
const showForm=x=>{const target=$('#editor');target.innerHTML=`<form id="editForm" class="card"><h3>${x?'Bearbeiten':'Neuer Eintrag'}</h3><div class="formgrid">${cmd?`<div><label>Command</label><input name="trigger" placeholder="!socials" value="${escapeHtml(x?.trigger||'!')}" required></div><div><label>Cooldown (Sekunden)</label><input name="cooldown" type="number" min="0" max="3600" value="${x?.cooldown??15}" required></div><div class="full"><label>Bot-Antwort (Platzhalter: {user}, {streamer})</label><textarea name="reply" required>${escapeHtml(x?.reply||'')}</textarea></div>`:`<div><label>Intervall (Minuten)</label><input name="minutes" type="number" min="1" max="1440" value="${x?.minutes??30}" required></div><div><label>Minimale Chat-Nachrichten</label><input name="minMessages" type="number" min="0" max="9999" value="${x?.minMessages??5}" required></div><div class="full"><label>Nachricht</label><textarea name="message" required>${escapeHtml(x?.message||'')}</textarea></div>`}<div class="full"><label><input name="enabled" type="checkbox" ${x?.enabled!==false?'checked':''}> Aktiviert</label></div></div><div class="actions"><button class="btn">Speichern</button><button type="button" class="btn secondary" id="cancel">Abbrechen</button></div></form>`;$('#cancel').onclick=()=>{edit=null;render()};$('#editForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data=cmd?{trigger:f.get('trigger').toLowerCase().trim(),cooldown:Number(f.get('cooldown')),reply:f.get('reply'),enabled:f.has('enabled')}:{minutes:Number(f.get('minutes')),minMessages:Number(f.get('minMessages')),message:f.get('message'),enabled:f.has('enabled')};try{await api('/api/'+tab+(x?'/'+encodeURIComponent(x.id):''),x?'PUT':'POST',data);edit=null;await load();notice('Gespeichert!')}catch(err){notice(err.message)}}};
$('#new').onclick=()=>showForm(null);el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=b.dataset.edit;showForm(items.find(x=>x.id===edit))});el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Wirklich löschen?'))return;await api('/api/'+tab+'/'+encodeURIComponent(b.dataset.delete),'DELETE');await load();notice('Gelöscht')});if(edit)showForm(edit);return;}
if(tab==='birthdays'){el.innerHTML=`<h2>Geburtstage 🎂</h2><p class="muted">Ohne Geburtsjahr. Zuschauer können sich selbst mit !birthday TT.MM eintragen.</p><form id="birthdayForm" class="card"><div class="formgrid"><div><label>Twitch-Username</label><input id="birthdayUser" placeholder="username" required pattern="[A-Za-z0-9_]{3,25}"></div><div><label>Geburtstag (TT.MM)</label><input id="birthdayDate" placeholder="24.08" required pattern="[0-9]{2}\.[0-9]{2}"></div></div><p></p><button class="btn">Geburtstag speichern</button></form>${Object.entries(state.birthdays).sort((a,b)=>a[1].slice(3).localeCompare(b[1].slice(3))||a[1].localeCompare(b[1])).map(([u,d])=>`<div class="item"><strong>@${escapeHtml(u)}</strong><span>${escapeHtml(d)}</span><button class="btn danger" data-user="${escapeHtml(u)}">Entfernen</button></div>`).join('')||'<p class="muted">Keine Geburtstage gespeichert.</p>'}`;$('#birthdayForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/birthdays/'+encodeURIComponent($('#birthdayUser').value),'PUT',{date:$('#birthdayDate').value});await load();notice('Geburtstag gespeichert')}catch(err){notice(err.message)}};el.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{await api('/api/birthdays/'+encodeURIComponent(b.dataset.user),'DELETE');await load();notice('Entfernt')});return;}
if(tab==='settings'){el.innerHTML=`<h2>Einstellungen</h2><p class="muted">Geburtstagsnachrichten für Vullcos Chat.</p><form id="settingsForm" class="card"><label>Geburtstagsnachricht ({user} wird ersetzt)</label><textarea id="congrats">${escapeHtml(state.settings.birthdayMessage||'')}</textarea><p></p><label><input type="checkbox" id="birthdayAnnouncements" ${state.settings.birthdayAnnouncements?'checked':''}> Geburtstag automatisch im Chat ankündigen</label><p></p><button class="btn">Speichern</button></form>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/settings','PUT',{birthdayMessage:$('#congrats').value,birthdayAnnouncements:$('#birthdayAnnouncements').checked,globalCooldown:5});await load();notice('Einstellungen gespeichert')}catch(err){notice(err.message)}};}}
boot().catch(console.error);
// Status der Übersicht regelmäßig erneuern; bei anderen Tabs bleiben Formulare unberührt.
setInterval(async()=>{if($('#dashboard').classList.contains('hide')||tab!=='overview')return;try{const data=await api('/api/state');state=data.state;runtime=data.runtime;render();await updateConnections();}catch(e){console.warn('Statusaktualisierung:',e.message)}},15000);
</script></body></html>
